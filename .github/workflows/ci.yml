name: ci

on:
  push:
    branches: [main, ci]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # --- native libs + bindings, built from the core/ submodule ----------
      # Same script, pins and toolchain as release builds (debug profile and
      # two ABIs here, to stay quick). Regenerating the bindings keeps the
      # committed ones honest: they must match the recorded core commit.

      - name: Rust toolchain (pinned in scripts/build-native.sh)
        run: |
          scripts/build-native.sh --install-toolchain
          echo "RUSTUP_TOOLCHAIN=$(sed -n 's/^RUST_VERSION=//p' scripts/build-native.sh)" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          cache-on-failure: true

      # arm64-v8a covers real devices, x86_64 covers emulators; release
      # builds (Gradle) always build all four.
      - name: Build spora-ffi from core/
        run: scripts/build-native.sh --abi arm64-v8a --abi x86_64

      - name: Bindings drift check
        run: |
          if ! git diff --quiet -- app/src/main/java/uniffi; then
            echo "::error::committed spora_ffi.kt does not match the bindings generated from core/ — run scripts/build-native.sh and commit app/src/main/java/uniffi"
            exit 1
          fi

      # --- the app itself -------------------------------------------------

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests, lint, assemble
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --console=plain

      - uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
